# Pruebas en cada push y pull request: tipos, lint, pruebas unitarias y las 3 de punta a punta (Playwright).
# En Railway, "Wait for CI" hace que solo se despliegue si esto pasa.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base de pruebas: la crea y la borra e2e/global-setup.ts en cada corrida.
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/planner3d_prueba
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/planner3d_prueba
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Pruebas unitarias
        run: npm test
      - name: Navegador para Playwright
        run: npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta
        run: npm run test:e2e
      - name: Rastros de Playwright si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rastros
          path: test-results/
          retention-days: 7
